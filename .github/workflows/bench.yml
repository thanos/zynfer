name: Bench

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu-ops:
    name: CPU ops-bench regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run ops-bench (ReleaseSafe, CPU)
        run: |
          set -euo pipefail
          zig build -Dhip=off -Doptimize=ReleaseSafe
          mkdir -p bench/results/local
          ZYNFER_BACKEND=cpu ./zig-out/bin/zynfer ops-bench | tee bench/results/local/ops-bench.txt
      - name: Compare against sanity ceiling
        run: /usr/bin/python3 scripts/ci/compare-bench.py bench/results/local/ops-bench.txt
      - name: Upload raw bench output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops-bench-cpu
          path: bench/results/local/ops-bench.txt
