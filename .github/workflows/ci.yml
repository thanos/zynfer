name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build fmt -Dhip=off

  test:
    name: Regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build (no HIP)
        run: zig build -Dhip=off
      - name: Unit, smoke, numerical
        env:
          ZYNFER_SKIP_APPLE_GPU: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
        run: zig build test -Dhip=off

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: CLI contracts
        run: zig build integration -Dhip=off
      - name: Shell env diagnostic
        run: ./scripts/check-env.sh
