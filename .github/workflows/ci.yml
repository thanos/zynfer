name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build fmt -Dhip=off

  test:
    name: Regression tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Build (no HIP)
        run: zig build -Dhip=off
      - name: Unit, smoke, numerical
        env:
          ZYNFER_SKIP_APPLE_GPU: ${{ matrix.os == 'macos-latest' && '1' || '0' }}
        run: zig build test -Dhip=off

  integration:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu: CPU CLI contracts + Core ML "unsupported" skip path.
        # macOS: Apple-linked binary + real `coreml-smoke` toy load/predict.
        # Pin macos-14 if you need a fixed image; macos-latest tracks GH current.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: CLI contracts
        run: zig build integration -Dhip=off
      - name: Shell env diagnostic
        run: ./scripts/check-env.sh
        # check-env is Linux/ROCm oriented; keep best-effort on macOS.
        continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
